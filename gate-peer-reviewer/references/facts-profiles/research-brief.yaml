# Facts profile: Research briefs (city / service / client)
#
# NON-SEO PROOF — demonstrates the facts registry mechanism works for
# research-brief artifacts, not just Core 30 pages. Same engine, different
# profile, different domain.
#
# Ground-truth source: the same data JSONs used downstream, plus any
# authoritative external references the brief should match.

facts_profile:
  profile_id: research-brief
  description: "Cross-check research brief claims against authoritative data sources"

  ground_truth_source:
    type: json-files
    base_path: "repos/ai-agency-core/scripts/data"
    paths:
      - pattern: "cities/{city_slug}.json"
        provides:
          - county
          - county_full
          - name_with_state
          - utility_coordination_phrase
      - pattern: "client-{client_slug}.json"
        provides:
          - name
          - owner_name
          - website_url

  checkable_facts:
    # City-base-research: county alignment
    # (D-10 analog — the city brief says "Fairfax County" but the city is in Stafford)
    - fact_key: city_county_alignment
      ground_truth_source_path: "cities/{city_slug}.json"
      ground_truth_field: county_full
      required_in_sources: true
      extraction_surfaces:
        - body_text                       # brief prose mentioning county
        - frontmatter                     # brief YAML frontmatter
      extraction_patterns:
        - '(?:county|jurisdiction|located\s+in)\s*:?\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+County)'
      match_mode: contains
      severity: blocking

    # City-base-research: utility companies
    # (D-11 analog — brief says "served by Dominion" but city has municipal electric)
    - fact_key: utility_companies
      ground_truth_source_path: "cities/{city_slug}.json"
      ground_truth_field: utility_coordination_phrase
      required_in_sources: false          # not all city JSONs have this yet
      extraction_surfaces:
        - body_text
      extraction_patterns:
        - '(?:served\s+by|utility|electric\s+provider|power\s+company)\s*:?\s*([^.;]+)'
      match_mode: contains
      severity: blocking

    # Client-fact-research: business name
    - fact_key: client_business_name
      ground_truth_source_path: "client-{client_slug}.json"
      ground_truth_field: name
      required_in_sources: true
      extraction_surfaces:
        - body_text
        - frontmatter
      extraction_patterns:
        - '(?:business|company|client)\s*(?:name)?\s*:?\s*"?([^"\n,]+)'
      match_mode: contains
      severity: blocking

    # Client-fact-research: owner name
    - fact_key: client_owner_name
      ground_truth_source_path: "client-{client_slug}.json"
      ground_truth_field: owner_name
      required_in_sources: true
      extraction_surfaces:
        - body_text
        - frontmatter
      extraction_patterns:
        - '(?:owner|founder|principal)\s*:?\s*"?([A-Z][a-z]+\s+[A-Z][a-z]+)'
      match_mode: exact
      severity: blocking

    # Jurisdiction-determinant: ZIP→jurisdiction anti-pattern (GPR-15, CR-140)
    # A brief that maps ZIP codes to permitting jurisdiction / AHJ is asserting
    # a false determinant — ZIPs cross municipal/corporate-limit boundaries.
    - fact_key: jurisdiction_determinant
      ground_truth_source_path: "cities/{city_slug}.json"
      ground_truth_field: null   # no single field — this is a structural check
      required_in_sources: false  # fires only when the brief names 2+ authorities
      extraction_surfaces:
        - body_text
      extraction_patterns: []     # mechanized by brief-preflight.py sub-checks below
      match_mode: structural
      severity: blocking
      sub_checks:
        # (a) Anti-pattern flag: any line co-locating a ZIP with a jurisdiction
        #     term in a way that asserts ZIP determines the permitting office.
        - id: zip_jurisdiction_anti_pattern
          description: "Flag any brief line that maps a ZIP code to a permitting jurisdiction / AHJ (ZIPs cross corporate limits)"
          pattern: '(?i)(?:zip|ZIP)\s*(?:code)?\s*\d{5}.*?(?:permit|jurisdiction|City of|County|AHJ|Code Admin|LDS|building official)|(?:permit|jurisdiction|AHJ|Code Admin|LDS|building official).*?(?:zip|ZIP)\s*(?:code)?\s*\d{5}'
          deterministic: true
          severity: blocking

        # (b) Require a non-ZIP determinant when the brief names >=2 permitting
        #     authorities for one city (corporate-limits / GIS / tax-bill test).
        - id: require_non_zip_determinant
          description: "When >=2 permitting authorities are named for one city, the brief must state a non-ZIP determinant (corporate-limits / GIS-parcel / tax-bill)"
          required_determinant_terms:
            - corporate.limits
            - GIS
            - parcel
            - tax.bill
            - town.limits
            - zoning.approval
          deterministic: true
          severity: blocking

        # (c) Cross-field ZIP-collision: a ZIP listed under one jurisdiction
        #     must not also appear as another jurisdiction's office/neighborhood
        #     address in the same brief (the 22035 self-contradiction class).
        - id: zip_collision
          description: "A ZIP under one jurisdiction must not also appear as another jurisdiction's office/neighborhood address"
          deterministic: true
          severity: blocking

  # This profile proves the mechanism is not SEO-specific:
  # - Same engine (ground-truth-value-cross-check procedure)
  # - Different artifact type (research brief, not HTML page)
  # - Different extraction surfaces (prose + frontmatter, not meta/JSON-LD)
  # - Different domain (research quality, not page correctness)
  # - Same defect class (wrong value for context)
